<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🍭 Ayo Berbagi! - Matematika Kelas 3 (Landscape)</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(145deg, #f9d976, #f39b7b, #a06cd5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #app {
            max-width: 1300px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 60px 60px 40px 40px;
            padding: 25px 30px 30px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
            border: 4px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
            border-bottom: 4px dashed #f3a683;
            padding-bottom: 12px;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 1.9rem;
            color: #e15f41;
            text-shadow: 3px 3px 0 #f8c291;
            letter-spacing: 1px;
        }
        h1 span { font-size: 2rem; }

        .info {
            display: flex;
            gap: 18px;
            background: #f8f9fa;
            padding: 8px 18px;
            border-radius: 50px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            font-weight: 700;
            color: #2d3436;
            font-size: 0.95rem;
        }
        .info span {
            background: #dfe6e9;
            padding: 4px 14px;
            border-radius: 30px;
        }
        .info #scoreDisplay { background: #fdcb6e; }
        .info #levelDisplay { background: #81ecec; color: #0984e3; }

        /* LANDSCAPE LAYOUT: main area flex row */
        .game-area {
            display: flex;
            flex-direction: row;
            gap: 25px;
            margin-top: 5px;
            align-items: stretch;
        }

        .left-panel {
            flex: 2;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .right-panel {
            flex: 1.2;
            min-width: 280px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 40px;
            padding: 20px 18px;
            border: 2px solid rgba(255,255,255,0.6);
        }

        .equation-box {
            background: #2d3436;
            padding: 12px 25px;
            border-radius: 50px;
            display: inline-block;
            margin: 0 auto 12px;
            box-shadow: 0 6px 0 #00000033;
            align-self: center;
        }
        .equation-box h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.6rem;
            color: #fff;
            letter-spacing: 4px;
            text-shadow: 2px 2px 0 #fdcb6e;
        }
        .equation-box h2 .highlight { color: #fdcb6e; }

        .place-value-area {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            background: #f1f2f6;
            border-radius: 50px;
            padding: 18px 15px;
            border: 3px dashed #a4b0be;
            flex: 1;
        }

        .pv-container {
            flex: 1;
            min-width: 180px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 30px;
            padding: 12px 8px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.03);
        }
        .pv-title {
            font-weight: 700;
            font-size: 1.1rem;
            color: #2d3436;
            background: #dfe6e9;
            display: inline-block;
            padding: 2px 18px;
            border-radius: 30px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }
        .pv-title.puluhan { background: #74b9ff; color: #fff; }
        .pv-title.satuan { background: #fd79a8; color: #fff; }

        .items-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            min-height: 80px;
        }

        .ten-stack {
            background: #ffeaa7;
            border-radius: 16px;
            padding: 6px 6px;
            border: 4px solid #fdcb6e;
            box-shadow: 0 4px 0 #b2bec3, 0 8px 16px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: all 0.15s ease;
            width: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .ten-stack:hover {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 6px 0 #b2bec3, 0 14px 24px rgba(0,0,0,0.12);
        }
        .ten-stack.borrow-hint {
            animation: pulse-glow 1.2s infinite;
            border-color: #e17055;
            background: #fab1a0;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(225, 112, 85, 0.6); }
            70% { box-shadow: 0 0 0 18px rgba(225, 112, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 112, 85, 0); }
        }
        .ten-stack .stack-label {
            font-weight: 800;
            font-size: 0.8rem;
            background: #e17055;
            color: #fff;
            padding: 0 10px;
            border-radius: 30px;
            margin-bottom: 2px;
        }
        .ten-stack .stack-items {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            font-size: 1.5rem;
            line-height: 1.1;
        }
        .ten-stack .stack-items span { display: block; text-align: center; }

        .one-item {
            font-size: 3.2rem;
            cursor: pointer;
            transition: all 0.15s ease;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.08));
            line-height: 1;
        }
        .one-item:hover {
            transform: scale(1.2) rotate(-8deg);
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
        }
        .one-item.disabled, .ten-stack.disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        /* Right panel styles */
        .tracker {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2d3436;
            background: #dfe6e9;
            padding: 10px 20px;
            border-radius: 40px;
            display: inline-block;
            text-align: center;
            box-shadow: inset 0 -3px 0 #b2bec3;
        }
        .tracker #remainingCount {
            font-size: 2rem;
            color: #d63031;
            background: #ffeaa7;
            padding: 0 14px;
            border-radius: 30px;
            margin-left: 6px;
        }
        .tracker .mobile-br { display: none; }

        .feedback {
            font-size: 1.5rem;
            font-weight: 700;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-align: center;
        }
        .feedback.correct { color: #00b894; }
        .feedback.wrong { color: #e17055; }

        .input-group {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .input-group label {
            font-weight: 700;
            font-size: 1.3rem;
            color: #2d3436;
        }
        .input-group input {
            font-family: 'Fredoka One', cursive;
            font-size: 2rem;
            width: 100px;
            text-align: center;
            padding: 8px 5px;
            border: 4px solid #b2bec3;
            border-radius: 30px;
            background: #fff;
            outline: none;
            transition: 0.2s;
            color: #2d3436;
        }
        .input-group input:focus {
            border-color: #0984e3;
            box-shadow: 0 0 0 6px rgba(9, 132, 227, 0.2);
        }

        .btn {
            font-family: 'Fredoka One', cursive;
            font-size: 1.2rem;
            padding: 10px 28px;
            border: none;
            border-radius: 50px;
            background: #00b894;
            color: #fff;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 6px 0 #006b5c;
            letter-spacing: 1px;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 9px 0 #006b5c; }
        .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #006b5c; }
        .btn-secondary { background: #fdcb6e; color: #2d3436; box-shadow: 0 6px 0 #b7950b; }
        .btn-secondary:hover { box-shadow: 0 9px 0 #b7950b; }
        .btn-success { background: #00b894; box-shadow: 0 6px 0 #006b5c; }
        .btn-success:hover { box-shadow: 0 9px 0 #006b5c; }
        .btn:disabled { opacity: 0.5; transform: translateY(3px); box-shadow: 0 3px 0 #2d3436; pointer-events: none; }

        .action-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            margin-top: 6px;
        }
        #nextBtnWrapper { width: 100%; text-align: center; }

        /* Responsive adjustments */
        @media (max-width: 1024px) {
            .game-area { flex-direction: column; }
            .right-panel { flex: none; width: 100%; min-width: unset; }
            .left-panel { flex: none; }
            .tracker .mobile-br { display: inline; }
        }

        @media (max-width: 600px) {
            #app { padding: 12px; }
            h1 { font-size: 1.4rem; }
            .equation-box h2 { font-size: 2rem; }
            .ten-stack { width: 85px; }
            .ten-stack .stack-items { font-size: 1.2rem; }
            .one-item { font-size: 2.4rem; }
            .place-value-area { flex-direction: column; gap: 12px; }
            .right-panel { padding: 14px; }
            .input-group input { width: 80px; font-size: 1.6rem; }
            .btn { font-size: 1rem; padding: 8px 18px; }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #fff;
            padding: 40px 50px;
            border-radius: 70px;
            text-align: center;
            max-width: 500px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.3);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-box h2 { font-family: 'Fredoka One', cursive; font-size: 2.8rem; color: #00b894; }
        .modal-box p { font-size: 1.4rem; margin: 18px 0; }

        /* Confetti */
        .confetti-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 999;
        }
        .confetti-piece {
            position: absolute;
            width: 12px; height: 12px;
            top: -20px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg) scale(0.2); opacity: 0; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            75% { transform: translateX(15px); }
        }
    </style>
</head>
<body>

<div id="app">
    <header>
        <h1><span>🍭</span> Ayo Berbagi!</h1>
        <div class="info">
            <span>🎯 Level <span id="levelDisplay">1</span></span>
            <span>⭐ Skor <span id="scoreDisplay">0</span></span>
            <span>📝 <span id="questionCounter">1/5</span></span>
        </div>
    </header>

    <div class="game-area">
        <!-- LEFT PANEL: Visual & persamaan -->
        <div class="left-panel">
            <div class="equation-box">
                <h2 id="equationText">45 - 23 = <span class="highlight">?</span></h2>
            </div>
            <div class="place-value-area">
                <div class="pv-container">
                    <div class="pv-title puluhan">⬛ PULUHAN (10)</div>
                    <div id="tensContainer" class="items-grid"></div>
                </div>
                <div class="pv-container">
                    <div class="pv-title satuan">⬜ SATUAN (1)</div>
                    <div id="onesContainer" class="items-grid"></div>
                </div>
            </div>
        </div>

        <!-- RIGHT PANEL: Kontrol & informasi -->
        <div class="right-panel">
            <div class="tracker" id="tracker">
                🖱️ Klik benda untuk mengurangi! <br class="mobile-br">
                Sisa: <span id="remainingCount">23</span>
            </div>
            <div id="feedback" class="feedback"></div>
            <div class="action-area">
                <div id="inputArea" class="input-group">
                    <label for="answerInput">Sisanya =</label>
                    <input type="number" id="answerInput" placeholder="?" min="0" max="99">
                    <button class="btn btn-success" id="checkBtn">✔️ Cek</button>
                </div>
                <div id="nextBtnWrapper">
                    <button class="btn btn-secondary" id="nextBtn" style="display:none;">➡️ Soal Berikutnya</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="levelModal" class="modal-overlay">
    <div class="modal-box">
        <h2 id="modalTitle">🎉 Hebat!</h2>
        <p id="modalDesc">Kamu berhasil menyelesaikan level ini!</p>
        <button class="btn" id="modalBtn">Lanjut ke Level 2</button>
    </div>
</div>

<script>
    // ==================== DATA GAME ====================
    const LEVELS = [{
        name: 'Makanan Lezat',
        emoji: ['🍬', '🍰', '🍓', '🥛', '🍫'],
        questions: [
            { minuend: 45, subtrahend: 23, answer: 22 },
            { minuend: 56, subtrahend: 34, answer: 22 },
            { minuend: 38, subtrahend: 15, answer: 23 },
            { minuend: 67, subtrahend: 42, answer: 25 },
            { minuend: 29, subtrahend: 14, answer: 15 }
        ]
    }, {
        name: 'Alat Tulis',
        emoji: ['📚', '✏️', '🧽', '📏', '🖊️'],
        questions: [
            { minuend: 52, subtrahend: 27, answer: 25 },
            { minuend: 43, subtrahend: 18, answer: 25 },
            { minuend: 60, subtrahend: 34, answer: 26 },
            { minuend: 71, subtrahend: 26, answer: 45 },
            { minuend: 82, subtrahend: 39, answer: 43 }
        ]
    }];

    // ==================== STATE ====================
    let state = {
        levelIdx: 0,
        qIdx: 0,
        score: 0,
        tens: 0,
        ones: 0,
        subtrahendTens: 0,
        subtrahendOnes: 0,
        remainingToSubtract: 0,
        borrowed: false,
        emoji: '🍬',
        questionDone: false,
        totalQuestions: 5,
        minuend: 0,
        subtrahend: 0,
        answer: 0
    };

    // DOM refs
    const $ = id => document.getElementById(id);
    const levelDisplay = $('levelDisplay');
    const scoreDisplay = $('scoreDisplay');
    const questionCounter = $('questionCounter');
    const equationText = $('equationText');
    const remainingCount = $('remainingCount');
    const tensContainer = $('tensContainer');
    const onesContainer = $('onesContainer');
    const feedback = $('feedback');
    const answerInput = $('answerInput');
    const checkBtn = $('checkBtn');
    const nextBtn = $('nextBtn');
    const tracker = $('tracker');
    const modal = $('levelModal');
    const modalTitle = $('modalTitle');
    const modalDesc = $('modalDesc');
    const modalBtn = $('modalBtn');

    // ==================== HELPERS ====================
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    // ==================== CORE LOGIC ====================
    function loadQuestion() {
        const levelData = LEVELS[state.levelIdx];
        const qData = levelData.questions[state.qIdx];
        const emoji = levelData.emoji[state.qIdx];

        state.emoji = emoji;
        state.minuend = qData.minuend;
        state.subtrahend = qData.subtrahend;
        state.answer = qData.answer;
        state.tens = Math.floor(qData.minuend / 10);
        state.ones = qData.minuend % 10;
        state.subtrahendTens = Math.floor(qData.subtrahend / 10);
        state.subtrahendOnes = qData.subtrahend % 10;
        state.remainingToSubtract = qData.subtrahend;
        state.borrowed = false;
        state.questionDone = false;

        // Update UI
        levelDisplay.textContent = state.levelIdx + 1;
        scoreDisplay.textContent = state.score;
        questionCounter.textContent = `${state.qIdx + 1}/${state.totalQuestions}`;
        equationText.innerHTML = `${state.minuend} - ${state.subtrahend} = <span class="highlight">?</span>`;
        remainingCount.textContent = state.remainingToSubtract;

        feedback.textContent = '';
        feedback.className = 'feedback';
        answerInput.value = '';
        answerInput.disabled = false;
        checkBtn.style.display = 'inline-block';
        nextBtn.style.display = 'none';
        answerInput.focus();

        // Update tracker text
        if (state.levelIdx === 1 && !state.borrowed && state.ones < state.subtrahendOnes) {
            tracker.innerHTML = `🔔 <strong>Klik tumpukan PULUHAN untuk meminjam!</strong>`;
        } else {
            tracker.innerHTML = `🖱️ Klik benda untuk mengurangi! <br class="mobile-br"> Sisa: <span id="remainingCount">${state.remainingToSubtract}</span>`;
        }

        renderItems();
    }

    function renderItems() {
        tensContainer.innerHTML = '';
        onesContainer.innerHTML = '';

        // Render Tens
        for (let i = 0; i < state.tens; i++) {
            const stack = document.createElement('div');
            stack.className = 'ten-stack';
            stack.dataset.index = i;
            stack.dataset.type = 'ten';

            const label = document.createElement('div');
            label.className = 'stack-label';
            label.textContent = '10';
            stack.appendChild(label);

            const itemsDiv = document.createElement('div');
            itemsDiv.className = 'stack-items';
            for (let j = 0; j < 10; j++) {
                const span = document.createElement('span');
                span.textContent = state.emoji;
                itemsDiv.appendChild(span);
            }
            stack.appendChild(itemsDiv);

            if (state.levelIdx === 1) {
                if (!state.borrowed && state.ones < state.subtrahendOnes && state.remainingToSubtract > 0) {
                    stack.classList.add('borrow-hint');
                }
                if (state.borrowed) {
                    // already borrowed, stacks are for subtracting
                }
            }

            tensContainer.appendChild(stack);
        }

        // Render Ones
        for (let i = 0; i < state.ones; i++) {
            const one = document.createElement('div');
            one.className = 'one-item';
            one.dataset.index = i;
            one.dataset.type = 'one';
            one.textContent = state.emoji;
            onesContainer.appendChild(one);
        }

        if (state.questionDone) {
            document.querySelectorAll('.ten-stack, .one-item').forEach(el => el.classList.add('disabled'));
        }

        const remSpan = document.getElementById('remainingCount');
        if (remSpan) remSpan.textContent = state.remainingToSubtract;
    }

    // ==================== INTERACTIONS ====================
    function handleItemClick(e) {
        const target = e.target.closest('.ten-stack, .one-item');
        if (!target) return;
        if (state.questionDone) return;
        if (state.remainingToSubtract <= 0) return;

        const type = target.dataset.type;

        // LEVEL 1: NO BORROW
        if (state.levelIdx === 0) {
            if (type === 'ten') {
                const remove = Math.min(10, state.remainingToSubtract);
                if (remove === 0) return;
                state.remainingToSubtract -= remove;
                state.tens -= 1;
                renderItems();
                updateTracker();
                checkIfSubtractionComplete();
                return;
            } else if (type === 'one') {
                if (state.remainingToSubtract <= 0) return;
                state.remainingToSubtract -= 1;
                state.ones -= 1;
                renderItems();
                updateTracker();
                checkIfSubtractionComplete();
                return;
            }
        }

        // LEVEL 2: WITH BORROW
        if (state.levelIdx === 1) {
            if (type === 'ten') {
                if (!state.borrowed && state.ones < state.subtrahendOnes && state.remainingToSubtract > 0) {
                    performBorrow();
                    renderItems();
                    updateTracker();
                    return;
                }

                if (state.borrowed || state.ones >= state.subtrahendOnes) {
                    const remove = Math.min(10, state.remainingToSubtract);
                    if (remove === 0) return;
                    state.remainingToSubtract -= remove;
                    state.tens -= 1;
                    renderItems();
                    updateTracker();
                    checkIfSubtractionComplete();
                    return;
                }
            }

            if (type === 'one') {
                if (!state.borrowed && state.ones <= state.subtrahendOnes && state.remainingToSubtract > 0) {
                    feedback.textContent = '🤔 Aduh, satuannya kurang! Klik tumpukan PULUHAN untuk meminjam!';
                    feedback.className = 'feedback wrong';
                    document.querySelectorAll('.ten-stack').forEach(el => el.classList.add('borrow-hint'));
                    setTimeout(() => {
                        document.querySelectorAll('.ten-stack').forEach(el => el.classList.remove('borrow-hint'));
                    }, 1500);
                    return;
                }

                if (state.remainingToSubtract <= 0) return;
                state.remainingToSubtract -= 1;
                state.ones -= 1;
                renderItems();
                updateTracker();
                checkIfSubtractionComplete();
                return;
            }
        }
    }

    function performBorrow() {
        if (state.tens <= 0) return;
        state.tens -= 1;
        state.ones += 10;
        state.borrowed = true;
        createMiniBurst();
        feedback.textContent = '🔄 Bagus! 1 puluhan berubah jadi 10 satuan. Sekarang kurangi!';
        feedback.className = 'feedback correct';
        tracker.innerHTML = `🖱️ Klik benda untuk mengurangi! <br class="mobile-br"> Sisa: <span id="remainingCount">${state.remainingToSubtract}</span>`;
    }

    function createMiniBurst() {
        const container = document.createElement('div');
        container.className = 'confetti-container';
        container.style.pointerEvents = 'none';
        const colors = ['#fdcb6e', '#e17055', '#00b894', '#0984e3', '#fd79a8', '#6c5ce7'];
        for (let i = 0; i < 30; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = Math.random() * 100 + '%';
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];
            piece.style.width = (Math.random() * 10 + 6) + 'px';
            piece.style.height = (Math.random() * 10 + 6) + 'px';
            piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            piece.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
            piece.style.animationDelay = (Math.random() * 0.5) + 's';
            container.appendChild(piece);
        }
        document.body.appendChild(container);
        setTimeout(() => container.remove(), 3000);
    }

    function updateTracker() {
        const remSpan = document.getElementById('remainingCount');
        if (remSpan) remSpan.textContent = state.remainingToSubtract;
        if (state.remainingToSubtract === 0) {
            tracker.innerHTML = `✅ Semua benda sudah dikurangi! Hitung sisanya.`;
        }
    }

    function checkIfSubtractionComplete() {
        if (state.remainingToSubtract === 0) {
            feedback.textContent = '✨ Bagus! Sekarang tulis berapa sisanya.';
            feedback.className = 'feedback correct';
            answerInput.focus();
        }
    }

    // ==================== CHECK ANSWER ====================
    function checkAnswer() {
        if (state.questionDone) return;
        const userAnswer = parseInt(answerInput.value);
        if (isNaN(userAnswer) || userAnswer < 0) {
            feedback.textContent = '✏️ Tulis angka yang benar ya!';
            feedback.className = 'feedback wrong';
            answerInput.value = '';
            answerInput.focus();
            return;
        }

        const currentRemaining = state.tens * 10 + state.ones;
        if (userAnswer === state.answer && userAnswer === currentRemaining) {
            state.score += 10;
            scoreDisplay.textContent = state.score;
            feedback.textContent = '🎉🎉 BENAR! Selamat! +10 poin';
            feedback.className = 'feedback correct';
            state.questionDone = true;
            answerInput.disabled = true;
            checkBtn.style.display = 'none';
            document.querySelectorAll('.ten-stack, .one-item').forEach(el => el.classList.add('disabled'));
            launchConfetti();
            nextBtn.style.display = 'inline-block';
            if (state.qIdx >= state.totalQuestions - 1) {
                nextBtn.textContent = '🏁 Selesai Level!';
            } else {
                nextBtn.textContent = '➡️ Soal Berikutnya';
            }
        } else {
            feedback.textContent = '❌ Coba lagi, hitung dengan teliti!';
            feedback.className = 'feedback wrong';
            answerInput.value = '';
            answerInput.focus();
            answerInput.style.animation = 'shake 0.4s';
            setTimeout(() => answerInput.style.animation = '', 500);
        }
    }

    function launchConfetti() {
        const container = document.createElement('div');
        container.className = 'confetti-container';
        const colors = ['#fdcb6e', '#e17055', '#00b894', '#0984e3', '#fd79a8', '#6c5ce7', '#f8a5c2', '#74b9ff'];
        for (let i = 0; i < 80; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = Math.random() * 100 + '%';
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];
            piece.style.width = (Math.random() * 12 + 6) + 'px';
            piece.style.height = (Math.random() * 12 + 6) + 'px';
            piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            piece.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            piece.style.animationDelay = (Math.random() * 0.8) + 's';
            container.appendChild(piece);
        }
        document.body.appendChild(container);
        setTimeout(() => container.remove(), 4000);
    }

    // ==================== NAVIGATION ====================
    function nextQuestion() {
        if (state.qIdx < state.totalQuestions - 1) {
            state.qIdx++;
            loadQuestion();
        } else {
            showLevelComplete();
        }
    }

    function showLevelComplete() {
        const isLastLevel = state.levelIdx >= LEVELS.length - 1;
        modalTitle.textContent = isLastLevel ? '🏆 SELESAI! LUAR BIASA!' : '🎉 LEVEL SELESAI!';
        modalDesc.innerHTML = `
            Skor kamu: <strong>${state.score}</strong> poin! <br>
            ${isLastLevel ? 'Kamu sudah menguasai pengurangan puluhan! 🌟' : 'Siap naik ke level berikutnya?'}
        `;
        modalBtn.textContent = isLastLevel ? '🔄 Main Lagi' : '🚀 Level 2';
        modal.style.display = 'flex';
    }

    function handleModalAction() {
        modal.style.display = 'none';
        if (state.levelIdx >= LEVELS.length - 1) {
            state.levelIdx = 0;
            state.qIdx = 0;
            state.score = 0;
            loadQuestion();
        } else {
            state.levelIdx++;
            state.qIdx = 0;
            loadQuestion();
        }
    }

    // ==================== EVENT BINDING ====================
    document.addEventListener('click', handleItemClick);
    checkBtn.addEventListener('click', checkAnswer);
    nextBtn.addEventListener('click', nextQuestion);
    modalBtn.addEventListener('click', handleModalAction);

    answerInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            if (checkBtn.style.display !== 'none') {
                checkAnswer();
            }
        }
    });

    // ==================== START GAME ====================
    LEVELS.forEach(level => {
        level.questions = shuffleArray(level.questions);
    });
    loadQuestion();

    console.log('🍭 Game Ayo Berbagi (Landscape) siap!');
</script>
</body>
</html>
