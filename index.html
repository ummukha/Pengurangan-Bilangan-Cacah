<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5">
    <title>🍭 Ayo Berbagi! - Matematika Kelas 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(145deg, #f9d976, #f39b7b, #a06cd5);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #app {
            max-width: 1100px;
            width: 100%;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 60px 60px 40px 40px;
            padding: 20px 25px 25px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.25);
            border: 4px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s;
            min-height: 500px;
            display: flex;
            flex-direction: column;
        }

        /* ========== HEADER ========== */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 15px;
            border-bottom: 4px dashed #f3a683;
            padding-bottom: 10px;
        }

        h1 {
            font-family: 'Fredoka One', cursive;
            font-size: 1.8rem;
            color: #e15f41;
            text-shadow: 3px 3px 0 #f8c291;
            letter-spacing: 1px;
            cursor: pointer;
        }
        h1 span { font-size: 2rem; }

        .info {
            display: flex;
            gap: 14px;
            background: #f8f9fa;
            padding: 6px 16px;
            border-radius: 50px;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
            flex-wrap: wrap;
            font-weight: 700;
            color: #2d3436;
            font-size: 0.9rem;
        }
        .info span {
            background: #dfe6e9;
            padding: 4px 12px;
            border-radius: 30px;
        }
        .info #scoreDisplay { background: #fdcb6e; }
        .info #levelDisplay { background: #81ecec; color: #0984e3; }

        /* ========== SCREENS ========== */
        .screen {
            display: none;
            flex-direction: column;
            flex: 1;
        }
        .screen.active {
            display: flex;
        }

        /* ========== MENU LEVEL ========== */
        .menu-level {
            align-items: center;
            justify-content: center;
            gap: 40px;
            padding: 30px 0;
            min-height: 350px;
        }
        .menu-level h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.8rem;
            color: #2d3436;
            text-shadow: 2px 2px 0 #dfe6e9;
        }
        .menu-level .level-buttons {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .level-btn {
            font-family: 'Fredoka One', cursive;
            font-size: 2.2rem;
            padding: 30px 50px;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 10px 0 rgba(0,0,0,0.2);
            color: #fff;
            min-width: 200px;
        }
        .level-btn:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 0 rgba(0,0,0,0.2);
        }
        .level-btn:active {
            transform: translateY(4px);
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
        }
        .level-btn.l1 {
            background: #fdcb6e;
            color: #2d3436;
        }
        .level-btn.l2 {
            background: #74b9ff;
            color: #fff;
        }
        .level-btn .sub {
            font-size: 1rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 400;
            display: block;
            margin-top: 6px;
            opacity: 0.9;
        }

        /* ========== DAFTAR SOAL ========== */
        .soal-list {
            padding: 10px 0;
            gap: 20px;
        }
        .soal-list .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .soal-list .top-bar h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 1.8rem;
            color: #2d3436;
        }
        .soal-list .top-bar .badge {
            background: #dfe6e9;
            padding: 6px 20px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 1rem;
        }
        .soal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 20px;
            margin: 15px 0;
        }
        .soal-card {
            background: #f8f9fa;
            border-radius: 30px;
            padding: 25px 10px;
            text-align: center;
            font-family: 'Fredoka One', cursive;
            font-size: 2rem;
            color: #2d3436;
            box-shadow: 0 6px 0 #b2bec3;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 4px solid transparent;
            position: relative;
        }
        .soal-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 0 #b2bec3;
        }
        .soal-card:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #b2bec3;
        }
        .soal-card.done {
            background: #a8e6cf;
            border-color: #00b894;
            box-shadow: 0 6px 0 #00856a;
        }
        .soal-card.done::after {
            content: "✅";
            position: absolute;
            top: -12px;
            right: -12px;
            font-size: 2rem;
            background: #fff;
            border-radius: 50%;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .soal-card .soal-number {
            font-size: 1.4rem;
            display: block;
            margin-bottom: 4px;
            color: #636e72;
        }
        .soal-card .soal-emoji {
            font-size: 2.4rem;
            display: block;
        }
        .btn-back {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            padding: 10px 24px;
            border: none;
            border-radius: 50px;
            background: #dfe6e9;
            color: #2d3436;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 0 #b2bec3;
            font-size: 1rem;
            align-self: flex-start;
        }
        .btn-back:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 0 #b2bec3;
        }
        .btn-back:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #b2bec3;
        }

        /* ========== GAME SCREEN ========== */
        .game-area {
            display: flex;
            flex-direction: row;
            gap: 20px;
            margin-top: 5px;
            align-items: stretch;
            flex: 1;
        }

        .left-panel {
            flex: 2;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }

        .right-panel {
            flex: 1.2;
            min-width: 260px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 40px;
            padding: 18px 16px;
            border: 2px solid rgba(255,255,255,0.6);
        }

        .equation-box {
            background: #2d3436;
            padding: 10px 20px;
            border-radius: 50px;
            display: inline-block;
            margin: 0 auto 10px;
            box-shadow: 0 6px 0 #00000033;
            align-self: center;
        }
        .equation-box h2 {
            font-family: 'Fredoka One', cursive;
            font-size: 2.4rem;
            color: #fff;
            letter-spacing: 3px;
            text-shadow: 2px 2px 0 #fdcb6e;
        }
        .equation-box h2 .highlight { color: #fdcb6e; }

        .place-value-area {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            background: #f1f2f6;
            border-radius: 50px;
            padding: 15px 12px;
            border: 3px dashed #a4b0be;
            flex: 1;
        }

        .pv-container {
            flex: 1;
            min-width: 160px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 30px;
            padding: 10px 6px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.03);
        }
        .pv-title {
            font-weight: 700;
            font-size: 1rem;
            color: #2d3436;
            background: #dfe6e9;
            display: inline-block;
            padding: 2px 16px;
            border-radius: 30px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }
        .pv-title.puluhan { background: #74b9ff; color: #fff; }
        .pv-title.satuan { background: #fd79a8; color: #fff; }

        .items-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            min-height: 70px;
        }

        .ten-stack {
            background: #ffeaa7;
            border-radius: 14px;
            padding: 6px 5px;
            border: 4px solid #fdcb6e;
            box-shadow: 0 4px 0 #b2bec3, 0 6px 12px rgba(0,0,0,0.08);
            cursor: pointer;
            transition: all 0.15s ease;
            width: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .ten-stack:hover {
            transform: scale(1.03) translateY(-2px);
            box-shadow: 0 6px 0 #b2bec3, 0 12px 20px rgba(0,0,0,0.12);
        }
        .ten-stack.borrow-hint {
            animation: pulse-glow 1.2s infinite;
            border-color: #e17055;
            background: #fab1a0;
        }
        @keyframes pulse-glow {
            0% { box-shadow: 0 0 0 0 rgba(225, 112, 85, 0.6); }
            70% { box-shadow: 0 0 0 16px rgba(225, 112, 85, 0); }
            100% { box-shadow: 0 0 0 0 rgba(225, 112, 85, 0); }
        }
        .ten-stack .stack-label {
            font-weight: 800;
            font-size: 0.75rem;
            background: #e17055;
            color: #fff;
            padding: 0 8px;
            border-radius: 30px;
            margin-bottom: 2px;
        }
        .ten-stack .stack-items {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
            font-size: 1.3rem;
            line-height: 1.1;
        }
        .ten-stack .stack-items span { display: block; text-align: center; }

        .one-item {
            font-size: 2.8rem;
            cursor: pointer;
            transition: all 0.15s ease;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.08));
            line-height: 1;
        }
        .one-item:hover {
            transform: scale(1.2) rotate(-8deg);
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
        }
        .one-item.disabled, .ten-stack.disabled {
            opacity: 0.4;
            pointer-events: none;
            filter: grayscale(0.5);
        }

        /* Right panel */
        .tracker {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2d3436;
            background: #dfe6e9;
            padding: 8px 16px;
            border-radius: 40px;
            display: inline-block;
            text-align: center;
            box-shadow: inset 0 -3px 0 #b2bec3;
        }
        .tracker #remainingCount {
            font-size: 1.8rem;
            color: #d63031;
            background: #ffeaa7;
            padding: 0 12px;
            border-radius: 30px;
            margin-left: 4px;
        }
        .tracker .mobile-br { display: none; }

        .feedback {
            font-size: 1.4rem;
            font-weight: 700;
            min-height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-align: center;
        }
        .feedback.correct { color: #00b894; }
        .feedback.wrong { color: #e17055; }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .input-group label {
            font-weight: 700;
            font-size: 1.2rem;
            color: #2d3436;
        }
        .input-group input {
            font-family: 'Fredoka One', cursive;
            font-size: 1.8rem;
            width: 90px;
            text-align: center;
            padding: 6px 4px;
            border: 4px solid #b2bec3;
            border-radius: 30px;
            background: #fff;
            outline: none;
            transition: 0.2s;
            color: #2d3436;
        }
        .input-group input:focus {
            border-color: #0984e3;
            box-shadow: 0 0 0 6px rgba(9, 132, 227, 0.2);
        }

        .btn {
            font-family: 'Fredoka One', cursive;
            font-size: 1.1rem;
            padding: 8px 22px;
            border: none;
            border-radius: 50px;
            background: #00b894;
            color: #fff;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 5px 0 #006b5c;
            letter-spacing: 1px;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 8px 0 #006b5c; }
        .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #006b5c; }
        .btn-secondary { background: #fdcb6e; color: #2d3436; box-shadow: 0 5px 0 #b7950b; }
        .btn-secondary:hover { box-shadow: 0 8px 0 #b7950b; }
        .btn-success { background: #00b894; box-shadow: 0 5px 0 #006b5c; }
        .btn-success:hover { box-shadow: 0 8px 0 #006b5c; }
        .btn-danger { background: #e17055; box-shadow: 0 5px 0 #b55a3a; }
        .btn-danger:hover { box-shadow: 0 8px 0 #b55a3a; }
        .btn:disabled { opacity: 0.5; transform: translateY(3px); box-shadow: 0 2px 0 #2d3436; pointer-events: none; }

        .action-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 4px;
        }
        .action-row {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            width: 100%;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 6px;
        }
        .game-header .btn-back {
            font-size: 0.9rem;
            padding: 6px 18px;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .game-area { flex-direction: column; }
            .right-panel { flex: none; width: 100%; min-width: unset; }
            .left-panel { flex: none; }
            .tracker .mobile-br { display: inline; }
        }

        @media (max-width: 600px) {
            #app { padding: 12px; }
            h1 { font-size: 1.4rem; }
            .equation-box h2 { font-size: 1.8rem; }
            .ten-stack { width: 80px; }
            .ten-stack .stack-items { font-size: 1.1rem; }
            .one-item { font-size: 2.2rem; }
            .place-value-area { flex-direction: column; gap: 10px; }
            .right-panel { padding: 12px; }
            .input-group input { width: 70px; font-size: 1.5rem; }
            .btn { font-size: 0.9rem; padding: 6px 14px; }
            .feedback { font-size: 1.2rem; min-height: 40px; }
            .tracker { font-size: 1rem; }
            .menu-level h2 { font-size: 2rem; }
            .level-btn { font-size: 1.6rem; padding: 20px 30px; min-width: 140px; }
            .soal-grid { grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); gap: 12px; }
            .soal-card { font-size: 1.6rem; padding: 18px 6px; }
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #fff;
            padding: 35px 40px;
            border-radius: 60px;
            text-align: center;
            max-width: 450px;
            box-shadow: 0 40px 80px rgba(0,0,0,0.3);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-box h2 { font-family: 'Fredoka One', cursive; font-size: 2.6rem; color: #00b894; }
        .modal-box p { font-size: 1.3rem; margin: 16px 0; }

        .confetti-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 999;
        }
        .confetti-piece {
            position: absolute;
            width: 12px; height: 12px;
            top: -20px;
            animation: confettiFall linear forwards;
        }
        @keyframes confettiFall {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translateY(110vh) rotate(720deg) scale(0.2); opacity: 0; }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-15px); }
            75% { transform: translateX(15px); }
        }
    </style>
</head>
<body>

<div id="app">
    <header>
        <h1 onclick="goToMenu()"><span>🍭</span> Ayo Berbagi!</h1>
        <div class="info">
            <span>⭐ Skor <span id="scoreDisplay">0</span></span>
            <span id="levelInfo">🏠 Menu</span>
        </div>
    </header>

    <!-- ===== SCREEN: MENU LEVEL ===== -->
    <div id="menuScreen" class="screen active menu-level">
        <h2>Pilih Level</h2>
        <div class="level-buttons">
            <button class="level-btn l1" onclick="selectLevel(0)">
                🍭 Level 1
                <span class="sub">Tanpa Meminjam</span>
            </button>
            <button class="level-btn l2" onclick="selectLevel(1)">
                ✏️ Level 2
                <span class="sub">Dengan Meminjam</span>
            </button>
        </div>
        <p style="margin-top: 30px; color: #636e72; font-weight: 600;">Klik level untuk mulai bermain!</p>
    </div>

    <!-- ===== SCREEN: DAFTAR SOAL ===== -->
    <div id="soalScreen" class="screen soal-list">
        <div class="top-bar">
            <h2 id="soalListTitle">📋 Level 1</h2>
            <span class="badge" id="progressBadge">0/5 selesai</span>
        </div>
        <div class="soal-grid" id="soalGrid"></div>
        <button class="btn-back" onclick="goToMenu()">← Kembali ke Menu</button>
    </div>

    <!-- ===== SCREEN: GAME ===== -->
    <div id="gameScreen" class="screen">
        <div class="game-header">
            <button class="btn-back" onclick="goToSoalList()">← Daftar Soal</button>
            <span style="font-weight:700; background:#dfe6e9; padding:4px 16px; border-radius:30px;" id="gameSoalIndicator">Soal 1/5</span>
        </div>
        <div class="game-area">
            <div class="left-panel">
                <div class="equation-box">
                    <h2 id="equationText">45 - 23 = <span class="highlight">?</span></h2>
                </div>
                <div class="place-value-area">
                    <div class="pv-container">
                        <div class="pv-title puluhan">⬛ PULUHAN (10)</div>
                        <div id="tensContainer" class="items-grid"></div>
                    </div>
                    <div class="pv-container">
                        <div class="pv-title satuan">⬜ SATUAN (1)</div>
                        <div id="onesContainer" class="items-grid"></div>
                    </div>
                </div>
            </div>
            <div class="right-panel">
                <div class="tracker" id="tracker">
                    🖱️ Klik benda untuk mengurangi! <br class="mobile-br">
                    Sisa: <span id="remainingCount">23</span>
                </div>
                <div id="feedback" class="feedback"></div>
                <div class="action-area">
                    <div id="inputArea" class="input-group">
                        <label for="answerInput">Sisanya =</label>
                        <input type="number" id="answerInput" placeholder="?" min="0" max="99">
                        <button class="btn btn-success" id="checkBtn">✔️ Cek</button>
                    </div>
                    <div class="action-row">
                        <button class="btn btn-danger" id="resetBtn">🔄 Ulangi Soal</button>
                        <button class="btn btn-secondary" id="nextBtn" style="display:none;">➡️ Soal Berikutnya</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal -->
<div id="levelModal" class="modal-overlay">
    <div class="modal-box">
        <h2 id="modalTitle">🎉 Hebat!</h2>
        <p id="modalDesc">Kamu berhasil menyelesaikan level ini!</p>
        <button class="btn" id="modalBtn">Lanjut ke Level 2</button>
    </div>
</div>

<script>
    // ==================== DATA ====================
    const LEVELS = [{
        name: 'Level 1 (Tanpa Meminjam)',
        emoji: ['🍬', '🍰', '🍓', '🥛', '🍫'],
        questions: [
            { minuend: 45, subtrahend: 23, answer: 22 },
            { minuend: 56, subtrahend: 34, answer: 22 },
            { minuend: 38, subtrahend: 15, answer: 23 },
            { minuend: 67, subtrahend: 42, answer: 25 },
            { minuend: 29, subtrahend: 14, answer: 15 }
        ]
    }, {
        name: 'Level 2 (Dengan Meminjam)',
        emoji: ['📚', '✏️', '🧽', '📏', '🖊️'],
        questions: [
            { minuend: 52, subtrahend: 27, answer: 25 },
            { minuend: 43, subtrahend: 18, answer: 25 },
            { minuend: 60, subtrahend: 34, answer: 26 },
            { minuend: 71, subtrahend: 26, answer: 45 },
            { minuend: 82, subtrahend: 39, answer: 43 }
        ]
    }];

    // ==================== STATE ====================
    let state = {
        levelIdx: 0,          // 0 atau 1
        qIdx: 0,              // 0-4
        score: 0,
        // progress[levelIdx][qIdx] = boolean (sudah dikerjakan)
        progress: [
            [false, false, false, false, false],
            [false, false, false, false, false]
        ],
        // state permainan
        tens: 0,
        ones: 0,
        subtrahendTens: 0,
        subtrahendOnes: 0,
        remainingToSubtract: 0,
        borrowed: false,
        emoji: '🍬',
        questionDone: false,
        minuend: 0,
        subtrahend: 0,
        answer: 0,
        // UI
        currentScreen: 'menu' // 'menu' | 'soalList' | 'game'
    };

    // ==================== DOM REFS ====================
    const $ = id => document.getElementById(id);
    const menuScreen = $('menuScreen');
    const soalScreen = $('soalScreen');
    const gameScreen = $('gameScreen');
    const soalGrid = $('soalGrid');
    const soalListTitle = $('soalListTitle');
    const progressBadge = $('progressBadge');
    const levelInfo = $('levelInfo');
    const scoreDisplay = $('scoreDisplay');
    const equationText = $('equationText');
    const tensContainer = $('tensContainer');
    const onesContainer = $('onesContainer');
    const remainingCount = $('remainingCount');
    const tracker = $('tracker');
    const feedback = $('feedback');
    const answerInput = $('answerInput');
    const checkBtn = $('checkBtn');
    const nextBtn = $('nextBtn');
    const resetBtn = $('resetBtn');
    const gameSoalIndicator = $('gameSoalIndicator');
    const modal = $('levelModal');
    const modalTitle = $('modalTitle');
    const modalDesc = $('modalDesc');
    const modalBtn = $('modalBtn');

    // ==================== SCREEN MANAGEMENT ====================
    function showScreen(screenName) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        if (screenName === 'menu') menuScreen.classList.add('active');
        else if (screenName === 'soalList') soalScreen.classList.add('active');
        else if (screenName === 'game') gameScreen.classList.add('active');
        state.currentScreen = screenName;
        // Update header info
        if (screenName === 'menu') {
            levelInfo.textContent = '🏠 Menu';
        } else if (screenName === 'soalList') {
            levelInfo.textContent = LEVELS[state.levelIdx].name;
        } else if (screenName === 'game') {
            levelInfo.textContent = `${LEVELS[state.levelIdx].name} - Soal ${state.qIdx+1}`;
        }
        scoreDisplay.textContent = state.score;
    }

    function goToMenu() {
        showScreen('menu');
    }

    function goToSoalList() {
        renderSoalList();
        showScreen('soalList');
    }

    // ==================== MENU ====================
    function selectLevel(idx) {
        state.levelIdx = idx;
        // Reset progress untuk level ini jika belum pernah
        // Tapi kita pertahankan progress yang sudah ada
        renderSoalList();
        showScreen('soalList');
    }

    // ==================== DAFTAR SOAL ====================
    function renderSoalList() {
        const level = LEVELS[state.levelIdx];
        soalListTitle.textContent = `📋 ${level.name}`;
        const progressArr = state.progress[state.levelIdx];
        const doneCount = progressArr.filter(Boolean).length;
        progressBadge.textContent = `${doneCount}/${level.questions.length} selesai`;

        soalGrid.innerHTML = '';
        level.questions.forEach((q, i) => {
            const card = document.createElement('div');
            card.className = 'soal-card';
            if (progressArr[i]) card.classList.add('done');
            card.innerHTML = `
                <span class="soal-number">Soal ${i+1}</span>
                <span class="soal-emoji">${level.emoji[i]}</span>
                <span style="font-size:1rem; display:block; margin-top:4px; color:#636e72;">
                    ${q.minuend} - ${q.subtrahend}
                </span>
            `;
            card.dataset.index = i;
            card.addEventListener('click', () => openSoal(i));
            soalGrid.appendChild(card);
        });

        // Jika semua soal sudah selesai, tampilkan pesan
        if (doneCount === level.questions.length) {
            const msg = document.createElement('div');
            msg.style.cssText = 'grid-column:1/-1; text-align:center; padding:20px; background:#a8e6cf; border-radius:40px; font-weight:700; font-size:1.4rem;';
            msg.textContent = '🎉 Semua soal selesai! Kembali ke menu untuk coba level lain.';
            soalGrid.appendChild(msg);
        }
    }

    function openSoal(index) {
        state.qIdx = index;
        // Jika soal sudah selesai, tetap bisa dibuka untuk review? Biarkan saja, tapi kita tetap load.
        loadQuestion();
        showScreen('game');
    }

    // ==================== GAME LOGIC ====================
    function loadQuestion() {
        const levelData = LEVELS[state.levelIdx];
        const qData = levelData.questions[state.qIdx];
        const emoji = levelData.emoji[state.qIdx];

        state.emoji = emoji;
        state.minuend = qData.minuend;
        state.subtrahend = qData.subtrahend;
        state.answer = qData.answer;
        state.tens = Math.floor(qData.minuend / 10);
        state.ones = qData.minuend % 10;
        state.subtrahendTens = Math.floor(qData.subtrahend / 10);
        state.subtrahendOnes = qData.subtrahend % 10;
        state.remainingToSubtract = qData.subtrahend;
        state.borrowed = false;
        state.questionDone = false;

        // Update UI
        gameSoalIndicator.textContent = `Soal ${state.qIdx+1}/${levelData.questions.length}`;
        equationText.innerHTML = `${state.minuend} - ${state.subtrahend} = <span class="highlight">?</span>`;
        remainingCount.textContent = state.remainingToSubtract;

        feedback.textContent = '';
        feedback.className = 'feedback';
        answerInput.value = '';
        answerInput.disabled = false;
        checkBtn.style.display = 'inline-block';
        nextBtn.style.display = 'none';
        resetBtn.style.display = 'inline-block';
        answerInput.focus();

        // Tracker
        if (state.levelIdx === 1 && !state.borrowed && state.ones < state.subtrahendOnes) {
            tracker.innerHTML = `🔔 <strong>Klik tumpukan PULUHAN untuk meminjam!</strong>`;
        } else {
            tracker.innerHTML = `🖱️ Klik benda untuk mengurangi! <br class="mobile-br"> Sisa: <span id="remainingCount">${state.remainingToSubtract}</span>`;
        }

        renderItems();
        scoreDisplay.textContent = state.score;
    }

    function renderItems() {
        tensContainer.innerHTML = '';
        onesContainer.innerHTML = '';

        // Tens
        for (let i = 0; i < state.tens; i++) {
            const stack = document.createElement('div');
            stack.className = 'ten-stack';
            stack.dataset.index = i;
            stack.dataset.type = 'ten';

            const label = document.createElement('div');
            label.className = 'stack-label';
            label.textContent = '10';
            stack.appendChild(label);

            const itemsDiv = document.createElement('div');
            itemsDiv.className = 'stack-items';
            for (let j = 0; j < 10; j++) {
                const span = document.createElement('span');
                span.textContent = state.emoji;
                itemsDiv.appendChild(span);
            }
            stack.appendChild(itemsDiv);

            if (state.levelIdx === 1) {
                if (!state.borrowed && state.ones < state.subtrahendOnes && state.remainingToSubtract > 0) {
                    stack.classList.add('borrow-hint');
                }
            }

            tensContainer.appendChild(stack);
        }

        // Ones
        for (let i = 0; i < state.ones; i++) {
            const one = document.createElement('div');
            one.className = 'one-item';
            one.dataset.index = i;
            one.dataset.type = 'one';
            one.textContent = state.emoji;
            onesContainer.appendChild(one);
        }

        if (state.questionDone) {
            document.querySelectorAll('.ten-stack, .one-item').forEach(el => el.classList.add('disabled'));
        }

        const remSpan = document.getElementById('remainingCount');
        if (remSpan) remSpan.textContent = state.remainingToSubtract;
    }

    // ==================== INTERACTIONS ====================
    document.addEventListener('click', function(e) {
        const target = e.target.closest('.ten-stack, .one-item');
        if (!target) return;
        if (state.currentScreen !== 'game') return;
        if (state.questionDone) return;
        if (state.remainingToSubtract <= 0) return;

        const type = target.dataset.type;

        // LEVEL 1
        if (state.levelIdx === 0) {
            if (type === 'ten') {
                const remove = Math.min(10, state.remainingToSubtract);
                if (remove === 0) return;
                state.remainingToSubtract -= remove;
                state.tens -= 1;
                renderItems();
                updateTracker();
                checkIfSubtractionComplete();
                return;
            } else if (type === 'one') {
                if (state.remainingToSubtract <= 0) return;
                state.remainingToSubtract -= 1;
                state.ones -= 1;
                renderItems();
                updateTracker();
                checkIfSubtractionComplete();
                return;
            }
        }

        // LEVEL 2
        if (state.levelIdx === 1) {
            if (type === 'ten') {
                if (!state.borrowed && state.ones < state.subtrahendOnes && state.remainingToSubtract > 0) {
                    performBorrow();
                    renderItems();
                    updateTracker();
                    return;
                }

                if (state.borrowed || state.ones >= state.subtrahendOnes) {
                    const remove = Math.min(10, state.remainingToSubtract);
                    if (remove === 0) return;
                    state.remainingToSubtract -= remove;
                    state.tens -= 1;
                    renderItems();
                    updateTracker();
                    checkIfSubtractionComplete();
                    return;
                }
            }

            if (type === 'one') {
                if (!state.borrowed && state.ones <= state.subtrahendOnes && state.remainingToSubtract > 0) {
                    feedback.textContent = '🤔 Aduh, satuannya kurang! Klik tumpukan PULUHAN untuk meminjam!';
                    feedback.className = 'feedback wrong';
                    document.querySelectorAll('.ten-stack').forEach(el => el.classList.add('borrow-hint'));
                    setTimeout(() => {
                        document.querySelectorAll('.ten-stack').forEach(el => el.classList.remove('borrow-hint'));
                    }, 1500);
                    return;
                }

                if (state.remainingToSubtract <= 0) return;
                state.remainingToSubtract -= 1;
                state.ones -= 1;
                renderItems();
                updateTracker();
                checkIfSubtractionComplete();
                return;
            }
        }
    });

    function performBorrow() {
        if (state.tens <= 0) return;
        state.tens -= 1;
        state.ones += 10;
        state.borrowed = true;
        createMiniBurst();
        feedback.textContent = '🔄 Bagus! 1 puluhan berubah jadi 10 satuan. Sekarang kurangi!';
        feedback.className = 'feedback correct';
        tracker.innerHTML = `🖱️ Klik benda untuk mengurangi! <br class="mobile-br"> Sisa: <span id="remainingCount">${state.remainingToSubtract}</span>`;
    }

    function createMiniBurst() {
        const container = document.createElement('div');
        container.className = 'confetti-container';
        container.style.pointerEvents = 'none';
        const colors = ['#fdcb6e', '#e17055', '#00b894', '#0984e3', '#fd79a8', '#6c5ce7'];
        for (let i = 0; i < 30; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = Math.random() * 100 + '%';
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];
            piece.style.width = (Math.random() * 10 + 6) + 'px';
            piece.style.height = (Math.random() * 10 + 6) + 'px';
            piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            piece.style.animationDuration = (Math.random() * 1.5 + 1) + 's';
            piece.style.animationDelay = (Math.random() * 0.5) + 's';
            container.appendChild(piece);
        }
        document.body.appendChild(container);
        setTimeout(() => container.remove(), 3000);
    }

    function updateTracker() {
        const remSpan = document.getElementById('remainingCount');
        if (remSpan) remSpan.textContent = state.remainingToSubtract;
        if (state.remainingToSubtract === 0) {
            tracker.innerHTML = `✅ Semua benda sudah dikurangi! Hitung sisanya.`;
        }
    }

    function checkIfSubtractionComplete() {
        if (state.remainingToSubtract === 0) {
            feedback.textContent = '✨ Bagus! Sekarang tulis berapa sisanya.';
            feedback.className = 'feedback correct';
            answerInput.focus();
        }
    }

    // ==================== CHECK ANSWER ====================
    function checkAnswer() {
        if (state.questionDone) return;
        const userAnswer = parseInt(answerInput.value);
        if (isNaN(userAnswer) || userAnswer < 0) {
            feedback.textContent = '✏️ Tulis angka yang benar ya!';
            feedback.className = 'feedback wrong';
            answerInput.value = '';
            answerInput.focus();
            return;
        }

        const currentRemaining = state.tens * 10 + state.ones;
        if (userAnswer === state.answer && userAnswer === currentRemaining) {
            // BENAR
            state.score += 10;
            scoreDisplay.textContent = state.score;
            feedback.textContent = '🎉🎉 BENAR! Selamat! +10 poin';
            feedback.className = 'feedback correct';
            state.questionDone = true;
            answerInput.disabled = true;
            checkBtn.style.display = 'none';
            resetBtn.style.display = 'none';
            document.querySelectorAll('.ten-stack, .one-item').forEach(el => el.classList.add('disabled'));
            launchConfetti();

            // Tandai soal selesai di progress
            state.progress[state.levelIdx][state.qIdx] = true;

            // Tampilkan tombol next atau selesai
            const total = LEVELS[state.levelIdx].questions.length;
            if (state.qIdx < total - 1) {
                nextBtn.textContent = '➡️ Soal Berikutnya';
                nextBtn.style.display = 'inline-block';
            } else {
                // Cek apakah semua soal selesai
                const allDone = state.progress[state.levelIdx].every(Boolean);
                if (allDone) {
                    nextBtn.textContent = '🏁 Selesai Level!';
                } else {
                    nextBtn.textContent = '📋 Kembali ke Daftar';
                }
                nextBtn.style.display = 'inline-block';
            }
        } else {
            feedback.textContent = '❌ Coba lagi, hitung dengan teliti! (Klik "Ulangi Soal" untuk mulai dari awal)';
            feedback.className = 'feedback wrong';
            answerInput.value = '';
            answerInput.focus();
            answerInput.style.animation = 'shake 0.4s';
            setTimeout(() => answerInput.style.animation = '', 500);
        }
    }

    function launchConfetti() {
        const container = document.createElement('div');
        container.className = 'confetti-container';
        const colors = ['#fdcb6e', '#e17055', '#00b894', '#0984e3', '#fd79a8', '#6c5ce7', '#f8a5c2', '#74b9ff'];
        for (let i = 0; i < 80; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti-piece';
            piece.style.left = Math.random() * 100 + '%';
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];
            piece.style.width = (Math.random() * 12 + 6) + 'px';
            piece.style.height = (Math.random() * 12 + 6) + 'px';
            piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            piece.style.animationDuration = (Math.random() * 2 + 1.5) + 's';
            piece.style.animationDelay = (Math.random() * 0.8) + 's';
            container.appendChild(piece);
        }
        document.body.appendChild(container);
        setTimeout(() => container.remove(), 4000);
    }

    // ==================== RESET ====================
    function resetQuestion() {
        if (state.questionDone) return;
        loadQuestion(); // reload ulang soal
        feedback.textContent = '🔄 Soal diulang! Coba lagi ya.';
        feedback.className = 'feedback';
    }

    // ==================== NAVIGASI SOAL ====================
    function nextQuestion() {
        const total = LEVELS[state.levelIdx].questions.length;
        if (state.qIdx < total - 1) {
            // ke soal berikutnya
            state.qIdx++;
            loadQuestion();
        } else {
            // semua soal sudah dikerjakan atau kembali ke daftar
            const allDone = state.progress[state.levelIdx].every(Boolean);
            if (allDone) {
                // Tampilkan modal selesai level
                showLevelComplete();
            } else {
                // Kembali ke daftar soal
                goToSoalList();
            }
        }
    }

    function showLevelComplete() {
        const isLastLevel = state.levelIdx >= LEVELS.length - 1;
        modalTitle.textContent = isLastLevel ? '🏆 SELESAI! LUAR BIASA!' : '🎉 LEVEL SELESAI!';
        modalDesc.innerHTML = `
            Skor kamu: <strong>${state.score}</strong> poin! <br>
            ${isLastLevel ? 'Kamu sudah menguasai pengurangan puluhan! 🌟' : 'Siap naik ke level berikutnya?'}
        `;
        modalBtn.textContent = isLastLevel ? '🔄 Main Lagi' : '🚀 Level 2';
        modal.style.display = 'flex';
    }

    function handleModalAction() {
        modal.style.display = 'none';
        if (state.levelIdx >= LEVELS.length - 1) {
            // Reset semua
            state.levelIdx = 0;
            state.qIdx = 0;
            state.score = 0;
            state.progress = [
                [false, false, false, false, false],
                [false, false, false, false, false]
            ];
            goToMenu();
        } else {
            // Pindah ke level berikutnya
            state.levelIdx++;
            state.qIdx = 0;
            // Pastikan progress untuk level baru ada (sudah ada)
            renderSoalList();
            showScreen('soalList');
        }
        scoreDisplay.textContent = state.score;
    }

    // ==================== EVENT BINDING ====================
    checkBtn.addEventListener('click', checkAnswer);
    nextBtn.addEventListener('click', nextQuestion);
    resetBtn.addEventListener('click', resetQuestion);
    modalBtn.addEventListener('click', handleModalAction);

    answerInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            if (checkBtn.style.display !== 'none') {
                checkAnswer();
            }
        }
    });

    // ==================== START ====================
    // Tampilkan menu awal
    showScreen('menu');
    scoreDisplay.textContent = '0';
    console.log('🍭 Game Ayo Berbagi dengan menu & daftar soal siap!');
</script>
</body>
</html>
